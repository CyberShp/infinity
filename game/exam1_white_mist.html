    .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }

    @keyframes beatFadeIn {

    }

  <script>
    (function bootstrap() {
      const eng = window.EXAM1_ENGINE;
      eng.onUpdate(() => window.UI.render());

      // 每次交互确保浏览器实录 BGM 正常解锁与续播
      document.addEventListener('pointerdown', () => {
        if (window.AudioEngine) window.AudioEngine.unlock();
      });

      // 空格 / 回车逐段推进叙事（输入框聚焦时不拦截）
      document.addEventListener('keydown', (e) => {
        if (e.key !== ' ' && e.key !== 'Enter') return;
        const tag = (e.target && e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'button') return;
        if (window.EXAM1_ENGINE && window.EXAM1_ENGINE.hasUnrevealedBeats()) {
          e.preventDefault();
          window.UI.nextBeat();
        }
      });

      const hash = (typeof location !== 'undefined' && location.hash) || '';
      if (hash === '#continue' && eng.load()) {
        window.UI.render();
      } else if (hash === '#new') {
        eng.init('char_select');
        window.UI.render();
      } else if (window.WhiteMistSave && typeof location !== 'undefined' && !hash) {
        // 默认直接打开本页时，若用户从书签或直链访问则进入开局出身选择，不强制踢回首页
        eng.init('char_select');
        window.UI.render();
      } else {
        eng.init('char_select');
        window.UI.render();
      }
    })();
  </script>
